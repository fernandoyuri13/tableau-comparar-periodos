server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index comparar-periodos-0.4.html;

    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "frame-ancestors 'self' https://online.tableau.com https://*.online.tableau.com" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
